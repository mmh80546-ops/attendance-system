<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف | Attendance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1f2429;
            background-image:
                linear-gradient(rgba(12, 15, 18, 0.88), rgba(12, 15, 18, 0.94)),
                url('assets/etc-logo-dark.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            direction: rtl;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .brand-logo {
            width: 160px;
            max-width: 60%;
            margin: 0 auto 16px;
            display: block;
            background: rgba(255, 255, 255, 0.96);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        }

        .header h1 {
            color: #ffffff;
            font-size: 22px;
        }

        .header p {
            color: #f47920;
            margin-top: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            border-top: 4px solid #f47920;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #f47920;
        }

        .btn-primary {
            background: linear-gradient(45deg, #f47920, #c75e12);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(45deg, #fc4a1a, #f7b733);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .hidden {
            display: none;
        }
        
        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="assets/etc-logo-light.jpeg" alt="شركة مسارات الامتياز - Excellence Tracks Co." class="brand-logo">
            <h1>نظام الحضور والانصراف</h1>
            <p>Attendance Management System</p>
        </div>
        
        <div class="app-card">
            <div id="loginSection">
                <h3>تسجيل الدخول | Login</h3>
                <div class="form-group">
                    <label>رقم الموظف | Employee ID:</label>
                    <input type="text" id="employeeId" placeholder="أدخل رقم الموظف">
                </div>
                <div class="form-group">
                    <label>اسم الموظف | Employee Name:</label>
                    <input type="text" id="employeeName" placeholder="أدخل اسم الموظف">
                </div>
                <div class="form-group">
                    <label>القسم | Department:</label>
                    <select id="department">
                        <option value="">اختر القسم</option>
                        <option value="الصيانة">الصيانة | Maintenance</option>
                        <option value="التشغيل">التشغيل | Operations</option>
                        <option value="الإدارة">الإدارة | Administration</option>
                        <option value="الموارد البشرية">الموارد البشرية | HR</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="login()">دخول | Login</button>
            </div>
            
            <div id="mainSection" class="hidden">
                <h4 id="welcomeMsg">مرحباً</h4>
                <p id="locationInfo">📍 جاري تحديد الموقع...</p>
                
                <div class="form-group">
                    <label>كود الموقع | Site Code:</label>
                    <input type="text" id="siteCode" placeholder="أدخل كود الموقع">
                </div>
                
                <button class="btn btn-success" onclick="checkIn()">✅ حضور | Check In</button>
                <button class="btn btn-danger" onclick="checkOut()">❌ انصراف | Check Out</button>
                <button class="btn btn-primary" onclick="logout()">🔓 خروج | Logout</button>
            </div>
            
            <div id="messageArea"></div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentLocation = null;
        
        function login() {
            const employeeId = document.getElementById('employeeId').value;
            const employeeName = document.getElementById('employeeName').value;
            const department = document.getElementById('department').value;
            
            if (!employeeId || !employeeName || !department) {
                showMessage('يرجى ملء جميع الحقول | Please fill all fields', 'error');
                return;
            }
            
            currentUser = { id: employeeId, name: employeeName, department: department };
            
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('welcomeMsg').textContent = `مرحباً ${employeeName} | Welcome ${employeeName}`;
            
            getCurrentLocation();
            showMessage('تم تسجيل الدخول بنجاح | Login successful', 'success');
        }
        
        function logout() {
            currentUser = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('mainSection').classList.add('hidden');
        }
        
        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        document.getElementById('locationInfo').textContent = 
                            `📍 تم تحديد الموقع | Location: ${currentLocation.lat.toFixed(4)}, ${currentLocation.lng.toFixed(4)}`;
                    },
                    () => {
                        document.getElementById('locationInfo').textContent = '❌ فشل تحديد الموقع | Location failed';
                    }
                );
            }
        }
        
        function checkIn() {
            if (!currentUser) return;
            const time = new Date().toLocaleString('ar-SA');
            showMessage(`✅ تم تسجيل الحضور في ${time} | Check-in recorded at ${time}`, 'success');
        }
        
        function checkOut() {
            if (!currentUser) return;
            const time = new Date().toLocaleString('ar-SA');
            showMessage(`❌ تم تسجيل الانصراف في ${time} | Check-out recorded at ${time}`, 'success');
        }
        
        function showMessage(message, type) {
            const messageArea = document.getElementById('messageArea');
            const messageClass = type === 'success' ? 'success-msg' : 'error-msg';
            messageArea.innerHTML = `<div class="${messageClass}">${message}</div>`;
            
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
